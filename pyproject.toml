[project]
name = "lolauncher"
version = "1.2.2"
description = "A League of Legends launcher language utility."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "keyboard>=0.13.5",
    "mouse>=0.7.1",
    "pygithub>=2.3.0",
    "PySide6>=6.7,<7",
    "PySide6-Fluent-Widgets>=1.11,<2",
    "ruamel.yaml>=0.18.6",
    "watchdog>=4.0.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.8.0",
    "pyinstaller-versionfile>=2.1.1",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-qt>=4.4.0",
]

[tool.uv]
package = false
